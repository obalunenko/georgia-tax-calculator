# =====================================================
#   Standard properties
# =====================================================
sonar.projectKey=obalunenko_georgia-tax-calculator
sonar.organization=obalunenko
sonar.projectName=georgia-tax-calculator
sonar.projectVersion=1.0
sonar.host.url=https://sonarcloud.io
# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
# This property is optional if sonar.modules is set.
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/test_*.py
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/test_*.py
sonar.test.exclusions=**/vendor/**
# Spec Kit tooling scripts run locally only; CI reports Go coverage alone.
sonar.coverage.exclusions=scripts/**
# =====================================================
#   Meta-data for the project
# =====================================================
sonar.links.homepage=https://github.com/obalunenko/georgia-tax-calculator
sonar.links.ci=https://github.com/obalunenko/georgia-tax-calculator/actions
sonar.links.issue=https://github.com/obalunenko/georgia-tax-calculator/issues
# =====================================================
#   Properties specific to Go
# =====================================================
sonar.go.golangci-lint.reportPaths=linters.out
sonar.go.tests.reportPaths=tests-report.json
sonar.go.coverage.reportPaths=coverage/full.cov
