services:
  bot:
    build:
      context: ../../
      dockerfile: build/docker/bot/Dockerfile
    image: ge-bot:local
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_BOT_LOG_LEVEL: ${TELEGRAM_BOT_LOG_LEVEL:-info}
      USER_STORE_PATH: ${USER_STORE_PATH:-users.json}
    volumes:
      # Keeps the user store across container recreation; `make bot-down` keeps it,
      # `docker compose down -v` removes it.
      - bot-data:/data

volumes:
  bot-data:
