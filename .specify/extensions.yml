installed:
- brownfield
- bugfix
- companion
- feature-numbering
settings:
  auto_execute_hooks: true
hooks:
  before_specify:
  - extension: companion
    command: speckit.companion.before-step
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-step?
    description: Save the specify start time until its folder exists
    condition: null
  - extension: feature-numbering
    command: speckit.feature-numbering.before-specify
    enabled: true
    optional: false
    priority: 5
    prompt: Execute speckit.feature-numbering.before-specify?
    description: Bind specify to the next NNN-feature-name directory
    condition: null
  after_implement:
  - extension: companion
    command: speckit.companion.after-implement
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-implement?
    description: Sync implement progress from tasks.md
    condition: null
  - extension: bugfix
    command: speckit.bugfix.verify
    enabled: true
    optional: true
    priority: 10
    prompt: Run bugfix consistency check after implementation?
    description: Verify spec artifact consistency after implementation completes
    condition: null
  before_plan:
  - extension: companion
    command: speckit.companion.before-step
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-step?
    description: Record the plan start
    condition: null
  before_tasks:
  - extension: companion
    command: speckit.companion.before-step
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-step?
    description: Record the tasks start
    condition: null
  before_implement:
  - extension: companion
    command: speckit.companion.before-step
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-step?
    description: Record the implement start
    condition: null
  after_specify:
  - extension: companion
    command: speckit.companion.after-specify
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-specify?
    description: Record the specify start and finish
    condition: null
  after_plan:
  - extension: companion
    command: speckit.companion.after-plan
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-plan?
    description: Record the plan finish
    condition: null
  after_tasks:
  - extension: companion
    command: speckit.companion.after-tasks
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-tasks?
    description: Record the tasks finish
    condition: null
  before_converge:
  - extension: companion
    command: speckit.companion.before-converge
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-converge?
    description: Record the converge start
    condition: null
  after_converge:
  - extension: companion
    command: speckit.companion.after-converge
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-converge?
    description: Record the converge finish
    condition: null
  after_init:
  - extension: brownfield
    command: speckit.brownfield.scan
    enabled: true
    optional: true
    priority: 10
    prompt: Scan this existing project to customize spec-kit configuration?
    description: Auto-scan project after spec-kit init to detect tech stack and conventions
    condition: null
